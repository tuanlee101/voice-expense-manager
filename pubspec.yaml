name: voice_expense_manager
description: "Voice Expense Manager - Ứng dụng quản lý chi tiêu bằng giọng nói"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.1
  path: ^1.9.1

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # UI
  intl: ^0.20.2
  fl_chart: ^0.70.2
  animations: ^2.0.11

  # Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  encrypt: ^5.0.3

  # Utilities
  shared_preferences: ^2.4.0
  csv: ^6.0.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
